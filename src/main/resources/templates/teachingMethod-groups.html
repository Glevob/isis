<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Groups of Method</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Groups for Method: <span th:text="${teachingMethod.nameMethod}"></span></h1>

  <a href="/teachingMethod" class="btn btn-secondary mb-3">Back to Methods</a>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Grade</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="studentGroup : ${studentGroups}">
      <td th:text="${studentGroup.idStudentGroup}"></td>
      <td th:text="${studentGroup.grade}"></td>
      <td>
        <a th:href="@{/studentGroups/{studentGroupId}/students(studentGroupId=${studentGroup.idStudentGroup})}"
           class="btn btn-sm btn-info">View Students</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
