<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Группы метода обучения</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>
      <span th:text="'Группы метода обучения: ' + ${teachingMethod.nameMethod}"></span>
    </h1>
    <a th:href="@{/studentGroup/add}" class="btn btn-primary">Добавить группу</a>
  </div>

  <!-- Список групп -->
  <div class="list-group">
    <div th:each="studentGroup : ${studentGroups}" class="list-group-item">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 th:text="${studentGroup.nameGroup}"></h5>
          <small class="text-muted" th:text="'ID: ' + ${studentGroup.idStudentGroup}"></small>
        </div>
        <div>
          <a th:href="@{'/studentGroup/' + ${studentGroup.idStudentGroup} + '/students'}"
             class="btn btn-sm btn-outline-primary me-2">Студенты</a>
          <a th:href="@{'/studentGroup/' + ${studentGroup.idStudentGroup}}"
             class="btn btn-sm btn-outline-secondary">Подробнее</a>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a href="/teachingMethod" class="btn btn-outline-secondary">Назад к методам обучения</a>
  </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
