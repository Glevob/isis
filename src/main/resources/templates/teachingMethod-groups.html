<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Группы метода обучения</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>
      <span th:text="'Группы метода обучения: ' + ${teachingMethod.nameMethod}"></span>
    </h1>
    <div>
      <a th:href="@{/studentGroup/add}" class="btn btn-primary me-2">Добавить группу</a>
      <a th:href="@{/teachingMethod}" class="btn btn-outline-secondary">Назад к методам</a>
    </div>
  </div>

  <!-- Список групп -->
  <div class="list-group">
    <div th:each="studentGroup : ${studentGroups}" class="list-group-item">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 th:text="${studentGroup.nameGroup}"></h5>
          <small class="text-muted" th:text="'ID: ' + ${studentGroup.idStudentGroup}"></small>
          <div class="mt-1">
            <span class="badge bg-info text-dark" th:text="'Студентов: ' + ${studentGroup.students.size()}"></span>
          </div>
        </div>
        <div class="btn-group">
          <a th:href="@{'/studentGroup/' + ${studentGroup.idStudentGroup} + '/students'}"
             class="btn btn-sm btn-outline-primary">Студенты</a>
          <button type="button" class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal"
                  th:attr="data-bs-groupid=${studentGroup.idStudentGroup},
                          data-bs-groupname=${studentGroup.nameGroup},
                          data-bs-studentcount=${studentGroup.students.size()}">
            Удалить
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно подтверждения удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Подтверждение удаления</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Вы действительно хотите удалить группу <span id="groupName" class="fw-bold"></span>?</p>
        <p class="text-danger">Будет также удалено <span id="studentCount" class="fw-bold"></span> студентов этой группы!</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <form id="deleteForm" method="post">
          <input type="hidden" name="_method" value="delete">
          <button type="submit" class="btn btn-danger">Удалить</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function(event) {
      const button = event.relatedTarget;
      const groupId = button.getAttribute('data-bs-groupid');
      const groupName = button.getAttribute('data-bs-groupname');
      const studentCount = button.getAttribute('data-bs-studentcount');

      document.getElementById('groupName').textContent = groupName;
      document.getElementById('studentCount').textContent = studentCount;
      document.getElementById('deleteForm').action = '/studentGroup/' + groupId;
    });
  });
</script>
</body>
</html>
