<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Студент</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px; /* Отступ для футера */
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px; /* Высота футера */
            line-height: 60px; /* Центрирование текста по вертикали */
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>
<div class="content">
    <div style="padding-top: 60px;" class="container mt-5">
        <h1>Студент</h1>
        <div class="alert alert-info mt-2">
            <p th:text="'ФИО: ' + ${student.fullName}"></p>
            <p th:text="'Группа: ' + ${student.studentGroup.getNameGroup()}"></p>
            <p th:text="'Метод обучения: ' + ${student.studentGroup.teachingMethod.getNameMethod()}"></p>

            <a th:href="@{/student/{id}/edit(id=${student.idStudent})}" class="btn btn-warning">Редактировать</a><br><br>
            <form th:action="@{/student/{id}/delete(id=${student.idStudent})}" method="post">
                <button class="btn btn-danger" type="submit">Удалить</button>
            </form>
        </div>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>
</body>
</html>
