<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --accent-color: #2e59d9;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .content-wrapper {
            flex: 1;
            padding: 2rem 0;
        }

        .student-card {
            border-radius: 0.5rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            border: none;
            transition: transform 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background-color: var(--primary-color);
            color: white;
            border-radius: 0.5rem 0.5rem 0 0 !important;
            padding: 1.25rem;
        }

        .info-item {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .action-btn {
            margin: 0.25rem;
            min-width: 120px;
            transition: all 0.2s;
        }

        .btn-edit {
            background-color: #f6c23e;
            border-color: #f6c23e;
        }

        .btn-edit:hover {
            background-color: #dda20a;
            border-color: #dda20a;
        }

        footer {
            background-color: var(--secondary-color);
            padding: 1rem 0;
            margin-top: auto;
            box-shadow: 0 -0.15rem 0.5rem rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="content-wrapper">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">
                <i class="bi bi-person-badge me-2"></i>Профиль студента
            </h1>
            <a href="/student" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Назад к списку
            </a>
        </div>

        <div class="card student-card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Основная информация</h5>
                <span class="badge bg-light text-dark">
                        ID: <span th:text="${student.idStudent}"></span>
                    </span>
            </div>
            <div class="card-body">
                <div class="info-item">
                    <h6 class="text-muted mb-1">ФИО</h6>
                    <p class="mb-0" th:text="${student.fullName}"></p>
                </div>
                <div class="info-item">
                    <h6 class="text-muted mb-1">Учебная группа</h6>
                    <p class="mb-0" th:text="${student.studentGroup.getNameGroup()}"></p>
                </div>
                <div class="info-item">
                    <h6 class="text-muted mb-1">Метод обучения</h6>
                    <p class="mb-0" th:text="${student.studentGroup.teachingMethod.getNameMethod()}"></p>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-start mt-4">
            <a th:href="@{/student/{id}/edit(id=${student.idStudent})}"
               class="btn btn-edit action-btn">
                <i class="bi bi-pencil-square me-1"></i> Редактировать
            </a>

            <a th:href="@{/student/{studentId}/grades(studentId=${student.idStudent})}"
               class="btn btn-primary action-btn">
                <i class="bi bi-journal-bookmark me-1"></i> Оценки
            </a>

            <form th:action="@{/student/{id}/delete(id=${student.idStudent})}" method="post" class="d-inline">
                <button class="btn btn-danger action-btn" type="submit"
                        onclick="return confirm('Вы уверены, что хотите удалить этого студента? Все его оценки также будут удалены.')">
                    <i class="bi bi-trash me-1"></i> Удалить
                </button>
            </form>
        </div>
    </div>
</div>

<footer class="footer">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
