<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Загрузка студентов из CSV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px; /* Отступ для футера */
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px; /* Высота футера */
            line-height: 60px; /* Центрирование текста по вертикали */
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>
<div class="content">
    <div class="container py-4">
        <h1>Загрузка студентов из CSV-файла</h1>

        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

        <form method="POST" action="/student/upload" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="studentGroup" class="form-label">Группа:</label>
                <select class="form-select" id="studentGroup" name="studentGroupId" required>
                    <option value="">Выберите группу</option>
                    <option th:each="group : ${studentGroups}"
                            th:value="${group.idStudentGroup}"
                            th:text="${group.nameGroup}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">CSV файл:</label>
                <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
                <div class="form-text">
                    Файл должен содержать имена студентов в первом столбце (по одному на строку).
                    Пример: <code>Иванов Иван Иванович</code>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Загрузить</button>
            <a href="/student" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>
</body>
</html>
