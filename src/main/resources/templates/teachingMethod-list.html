<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список методов обучения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .method-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .method-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .count-badge {
            font-size: 0.9rem;
        }
        .students-badge {
            background-color: #0d6efd;
        }
        .groups-badge {
            background-color: #198754;
        }
        .empty-methods {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
        }
        .empty-icon {
            font-size: 3rem;
            color: #adb5bd;
            margin-bottom: 15px;
        }
        .stats-container {
            display: flex;
            gap: 10px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px; /* Отступ для футера */
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px; /* Высота футера */
            line-height: 60px; /* Центрирование текста по вертикали */
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="content">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Список методов обучения</h1>
            <a href="/teachingMethod/add" class="btn btn-primary">Добавить метод обучения</a>
        </div>

        <!-- Блок для пустого списка методов -->
        <div th:if="${teachingMethods.empty}" class="empty-methods">
            <i class="bi bi-book empty-icon"></i>
            <h3 class="mb-3">Методы обучения не найдены</h3>
            <p class="text-muted mb-4">Вы можете добавить новый метод обучения, нажав на кнопку ниже</p>
            <a href="/teachingMethod/add" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Добавить метод обучения
            </a>
        </div>

        <!-- Список методов обучения -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div th:each="teachingMethod : ${teachingMethods}" class="col">
                <div class="card method-card h-100"
                     th:onclick="'window.location.href=\'/teachingMethod/' + ${teachingMethod.idTeachingMethod} + '/groups\''">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${teachingMethod.nameMethod}">Метод обучения</h5>

                        <div class="stats-container mt-3">
                            <div class="stat-item">
                                <span class="text-muted small">Групп:</span>
                                <span class="badge groups-badge count-badge"
                                      th:text="${teachingMethod.studentGroups.size()}">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                    </div>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
