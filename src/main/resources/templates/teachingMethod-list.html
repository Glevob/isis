<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список методов обучения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .group-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .group-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .student-count-badge {
            font-size: 0.9rem;
        }
        .empty-groups {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список методов обучения</h1>
        <a href="/teachingMethod/add" class="btn btn-primary">Добавить метод обучения</a>
    </div>

    <!-- Список групп -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="teachingMethod : ${teachingMethods}" class="col">
            <div class="card group-card h-100"
                 th:onclick="'window.location.href=\'/teachingMethod/' + ${teachingMethod.idTeachingMethod} + '/students\''">
                <div class="card-body">
                    <h5 class="card-title" th:text="${teachingMethod.nameMethod}">Метод обучения</h5>
                    <!--                    <h3 class="card-title" th:text="${teachingMethod.nameMethod}">Метод обучения</h3>-->
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">Количество студентов:</span>
                        <span class="badge bg-primary student-count-badge"
                              th:text="${teachingMethod.students.size()}">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
