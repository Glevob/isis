<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список методов обучения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .method-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .method-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .count-badge {
            font-size: 0.9rem;
        }
        .students-badge {
            background-color: #0d6efd;
        }
        .groups-badge {
            background-color: #198754;
        }
        .empty-methods {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats-container {
            display: flex;
            gap: 10px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список методов обучения</h1>
        <a href="/teachingMethod/add" class="btn btn-primary">Добавить метод обучения</a>
    </div>

    <!-- Список методов обучения -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="teachingMethod : ${teachingMethods}" class="col">
            <div class="card method-card h-100"
                 th:onclick="'window.location.href=\'/teachingMethod/' + ${teachingMethod.idTeachingMethod} + '/students\''">
                <div class="card-body">
                    <h5 class="card-title" th:text="${teachingMethod.nameMethod}">Метод обучения</h5>

                    <div class="stats-container mt-3">
                        <div class="stat-item">
                            <span class="text-muted small">Групп:</span>
                            <span class="badge groups-badge count-badge"
                                  th:text="${teachingMethod.studentGroups.size()}">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Сообщение если методов нет -->
        <div th:if="${teachingMethods.empty}" class="col-12">
            <div class="card empty-methods">
                <div class="card-body text-center">
                    <h5 class="card-title">Методы обучения не найдены</h5>
                    <p class="text-muted">Добавьте первый метод обучения, нажав на кнопку выше</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
