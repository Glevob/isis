<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список групп</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .group-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .group-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .student-count-badge {
            font-size: 0.9rem;
        }
        .empty-groups {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
        }
        .empty-groups-icon {
            font-size: 3rem;
            color: #adb5bd;
            margin-bottom: 15px;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px;
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px;
            line-height: 60px;
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="content">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Список учебных групп</h1>
            <a href="/studentGroup/add" class="btn btn-primary">Добавить группу</a>
        </div>

        <!-- Блок для пустого списка групп -->
        <div th:if="${studentGroups.empty}" class="empty-groups">
            <i class="bi bi-people empty-groups-icon"></i>
            <h3 class="mb-3">Группы не найдены</h3>
            <p class="text-muted mb-4">Вы можете добавить новую учебную группу, нажав на кнопку ниже</p>
            <a href="/studentGroup/add" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Добавить группу
            </a>
        </div>

        <!-- Список групп (отображается только если есть группы) -->
        <div th:unless="${studentGroups.empty}" class="row row-cols-1 row-cols-md-3 g-4">
            <div th:each="studentGroup : ${studentGroups}" class="col">
                <div class="card group-card h-100"
                     th:onclick="'window.location.href=\'/studentGroup/' + ${studentGroup.idStudentGroup} + '/students\''">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${studentGroup.nameGroup}">Название группы</h5>
                        <h3 class="card-title" th:text="${studentGroup.teachingMethod.nameMethod}">Метод обучения</h3>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted">Количество студентов:</span>
                            <span class="badge bg-primary student-count-badge"
                                  th:text="${studentGroup.students.size()}">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
