<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Оценки группы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .grade-cell {
      min-width: 80px;
      text-align: center;
    }
    .student-name {
      font-weight: bold;
    }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .content {
      flex: 1 0 auto;
      padding-bottom: 60px; /* Отступ для футера */
    }
    .footer {
      flex-shrink: 0;
      width: 100%;
      height: 60px; /* Высота футера */
      line-height: 60px; /* Центрирование текста по вертикали */
    }
  </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>
<div class="content">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>
        <span th:text="'Оценки группы: ' + ${studentGroup.nameGroup}"></span>
      </h1>
      <a th:href="@{'/studentGroup/' + ${studentGroup.idStudentGroup} + '/students'}"
         class="btn btn-secondary">Назад к группе</a>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
          <th class="student-name">ФИО</th>
          <th th:each="date : ${distinctDates}"
              th:text="${#temporals.format(date, 'dd.MM.yyyy')}"
              class="grade-cell"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${studentsWithGrades}">
          <td class="student-name" th:text="${student.fullName}"></td>
          <td th:each="date : ${distinctDates}" class="grade-cell">
              <span th:each="grade : ${student.grades}"
                    th:if="${grade.testDate == date}"
                    th:text="${grade.valueScore}">-</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<footer class="footer bg-light text-center">
  <div th:insert="~{blocks/footer :: footer}"></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
