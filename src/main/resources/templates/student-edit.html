<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование данных студента</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px; /* Отступ для футера */
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px; /* Высота футера */
            line-height: 60px; /* Центрирование текста по вертикали */
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>
<div class="content">
    <div style="padding-top: 60px;" class="container mt-5">
        <h1>Редактирование данных студента</h1>
        <div th:each="el : ${student}">
            <form method="post" enctype="multipart/form-data">
                <label>ФИО студента</label>
                <input type="text" th:value="${student.fullName}" name="fullName" placeholder="Введите ФИО студента" class="form-control" required><br>

                <label>Группа студента</label>
                <label for="studentGroup">Выберите группу:</label>
                <select name="studentGroupId" id="studentGroup" class="form-control">
                    <option th:each="studentGroup : ${studentGroups}" th:value="${studentGroup.idStudentGroup}"
                            th:text="${studentGroup.getNameGroup()}"
                            th:selected="${studentGroup.idStudentGroup == el.studentGroup.idStudentGroup}"></option>
                </select><br>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/post/add'">Добавить группу</button><br><br>

                <button type="submit" class="btn btn-success">Обновить</button>
            </form>
        </div>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>
</body>
</html>
