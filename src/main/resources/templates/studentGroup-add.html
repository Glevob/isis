<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавление группы</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div style="padding-top: 60px;" class="container mt-5">
    <h1>Добавление группы</h1>
    <form action="/studentGroup/add" method="post">
        <input type="text" name="grade" placeholder="Введите наименование группы" class="form-control"><br>

        <label for="teachingMethods">Выберите метод обучения:</label>
        <select name="teachingMethodId" id="teachingMethods" class="form-control" required>
            <option th:each="teachingMethod : ${teachingMethods}" th:value="${teachingMethod.idTeachingMethod}"
                    th:text="${teachingMethod.getNameMethod()}"></option>
        </select><br>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='/teachingMethod/add'">Добавить метод обучения</button><br><br>

        <button type="submit" class="btn btn-success">Добавить группу</button>
    </form>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
