<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оценки студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grade-actions {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <span th:text="'Оценки студента: ' + ${student.fullName}"></span>
            <small class="text-muted d-block mt-1" th:text="'Группа: ' + ${student.studentGroup.nameGroup}"></small>
        </h1>
        <div>
            <a th:href="@{/students/{studentId}/grades/add(studentId=${student.idStudent})}"
               class="btn btn-primary me-2">Добавить оценку</a>
            <a th:href="@{'/studentGroup/' + ${student.studentGroup.idStudentGroup} + '/students'}"
               class="btn btn-secondary">Назад к группе</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead class="table-light">
        <tr>
            <th>Дата</th>
            <th>Тест</th>
            <th>Оценка</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="grade : ${grades}">
            <td th:text="${#temporals.format(grade.testDate, 'dd.MM.yyyy')}"></td>
            <td th:text="${grade.testName}"></td>
            <td th:text="${grade.valueScore}"></td>
            <td class="grade-actions">
                <button type="button" class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteGradeModal"
                        th:attr="data-bs-grade-id=${grade.idGrade},
                                data-bs-grade-test=${grade.testName},
                                data-bs-grade-date=${#temporals.format(grade.testDate, 'dd.MM.yyyy')},
                                data-bs-student-id=${student.idStudent}"> <!-- Добавлен новый атрибут -->
                    Удалить
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно подтверждения удаления оценки -->
<div class="modal fade" id="deleteGradeModal" tabindex="-1" aria-labelledby="deleteGradeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteGradeModalLabel">Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Вы действительно хотите удалить оценку?</p>
                <p>
                    <strong>Тест:</strong> <span id="gradeTestName"></span><br>
                    <strong>Дата:</strong> <span id="gradeTestDate"></span><br>
                    <strong>Оценка:</strong> <span id="gradeValue"></span>
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <form id="deleteGradeForm" method="post">
                    <input type="hidden" name="studentId" th:value="${student.idStudent}">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const deleteGradeModal = document.getElementById('deleteGradeModal');
        deleteGradeModal.addEventListener('show.bs.modal', function(event) {
            const button = event.relatedTarget;
            const gradeId = button.getAttribute('data-bs-grade-id');
            const testName = button.getAttribute('data-bs-grade-test');
            const testDate = button.getAttribute('data-bs-grade-date');
            const gradeValue = button.parentElement.parentElement.querySelector('td:nth-child(3)').textContent;

            document.getElementById('gradeTestName').textContent = testName;
            document.getElementById('gradeTestDate').textContent = testDate;
            document.getElementById('gradeValue').textContent = gradeValue;
            document.getElementById('deleteGradeForm').action = '/student/grades/' + gradeId;
        });
    });
</script>
</body>
</html>
