<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Студенты | Учебный портал</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --accent-color: #ffc107;
            --dark-color: #5a5c69;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            padding-top: 80px;
            padding-bottom: 60px;
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--primary-color) !important;
        }

        h1, h2, h3, h4 {
            color: var(--dark-color);
            font-weight: 600;
        }

        .filter-section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            border: 1px solid #e3e6f0;
        }

        .filter-section h4 {
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e3e6f0;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-warning {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #212529;
        }

        .student-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
            border-left: 4px solid var(--primary-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1.5rem 0 rgba(58, 59, 69, 0.2);
        }

        .student-card h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .student-info {
            margin-bottom: 15px;
        }

        .student-info i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .footer {
            background-color: white;
            padding: 20px 0;
            border-top: 1px solid #e3e6f0;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }

        .empty-state i {
            font-size: 3rem;
            color: #dddfeb;
            margin-bottom: 15px;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #print-content, #print-content * {
                visibility: visible;
            }
            #print-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background-color: white;
            }
            .table {
                width: 100%;
                border-collapse: collapse;
            }
            .table th {
                background-color: #f8f9fa !important;
            }
        }

        #print-content {
            display: none;
        }

        .print-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .print-header h1 {
            color: var(--primary-color);
        }

        .print-footer {
            margin-top: 30px;
            text-align: right;
            font-size: 0.9rem;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .content {
                padding-top: 60px;
            }

            .filter-form .col-md-5,
            .filter-form .col-md-2 {
                margin-bottom: 15px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .action-buttons a,
            .action-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="content">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-people-fill me-2"></i>Студенты</h1>
            <div>
                <span class="badge bg-primary rounded-pill" th:text="${students.size()} + ' студентов'"></span>
            </div>
        </div>

        <!-- Секция фильтрации -->
        <div class="filter-section">
            <h4><i class="bi bi-funnel-fill me-2"></i>Фильтр студентов</h4>
            <form th:action="@{/student}" method="get" class="filter-form">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="studentGroupId" class="form-label">Группа:</label>
                        <select class="form-select" id="studentGroupId" name="studentGroupId">
                            <option value="">Все группы</option>
                            <option th:each="studentGroup : ${studentGroups}"
                                    th:value="${studentGroup.idStudentGroup}"
                                    th:text="${studentGroup.nameGroup}"
                                    th:selected="${selectedGroup == studentGroup.idStudentGroup}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="teachingMethodId" class="form-label">Метод обучения:</label>
                        <select class="form-select" id="teachingMethodId" name="teachingMethodId">
                            <option value="">Все методы</option>
                            <option th:each="teachingMethod : ${teachingMethods}"
                                    th:value="${teachingMethod.idTeachingMethod}"
                                    th:text="${teachingMethod.nameMethod}"
                                    th:selected="${selectedMethod == teachingMethod.idTeachingMethod}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-filter-circle me-1"></i> Применить
                        </button>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <a th:href="@{/student}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Сбросить фильтры
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <div class="action-buttons">
            <a href="/student/add" class="btn btn-warning">
                <i class="bi bi-plus-circle-fill me-1"></i> Добавить студента
            </a>
            <button type="button" class="btn btn-primary" onclick="window.print()">
                <i class="bi bi-printer-fill me-1"></i> Печать
            </button>
        </div>

        <div th:if="${students.empty}" class="empty-state">
            <i class="bi bi-emoji-frown"></i>
            <h3>Студентов не найдено</h3>
            <p class="text-muted">Попробуйте изменить параметры фильтра или добавить нового студента</p>
            <a href="/student/add" class="btn btn-warning mt-3">
                <i class="bi bi-plus-circle-fill me-1"></i> Добавить студента
            </a>
        </div>

        <div th:each="student : ${students}" class="student-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h3 th:text="${student.fullName}"></h3>
                    <div class="student-info">
                        <p><i class="bi bi-people-fill"></i> <span th:text="${student.studentGroup.nameGroup}"></span></p>
                        <p><i class="bi bi-book-half"></i> <span th:text="${student.studentGroup.teachingMethod.nameMethod}"></span></p>
                    </div>
                </div>
                <a th:href="'/student/' + ${student.idStudent}" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-right-circle-fill me-1"></i> Подробнее
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Контейнер для печатной формы -->
<div id="print-content">
    <div class="print-header">
        <h1><i class="bi bi-people-fill"></i> Список студентов</h1>
        <p th:text="'Дата формирования: ' + ${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy HH:mm')}"></p>
    </div>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">№</th>
            <th scope="col">ФИО</th>
            <th scope="col">Группа</th>
            <th scope="col">Метод обучения</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student, stat : ${students}">
            <td th:text="${stat.count}"></td>
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.studentGroup.nameGroup}"></td>
            <td th:text="${student.studentGroup.teachingMethod.nameMethod}"></td>
        </tr>
        </tbody>
    </table>

    <div class="print-footer">
        <p>Сформировано системой управления учебным процессом</p>
    </div>
</div>

<footer class="footer">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        window.onbeforeprint = function() {
            document.getElementById('print-content').style.display = 'block';
        };
        window.onafterprint = function() {
            document.getElementById('print-content').style.display = 'none';
        };
    });
</script>
</body>
</html>
