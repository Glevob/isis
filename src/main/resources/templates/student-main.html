<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Студенты</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-content, #print-content * {
                visibility: visible;
            }
            #print-content {
                position: absolute;
                left: 0;
                top: 0;
            }
        }
        #print-content {
            display: none;
        }
        .author-cell {
            max-width: 200px;
            word-wrap: break-word;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .filter-form .row {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div style="padding-top: 60px;" class="container mt-5">
    <h1>Студенты</h1>

    <!-- Секция фильтрации -->
    <div class="filter-section">
        <h4>Фильтр студентов</h4>
        <form th:action="@{/student}" method="get" class="filter-form">
            <div class="row">
                <div class="col-md-5">
                    <label for="studentGroupId" class="form-label">Группа:</label>
                    <select class="form-select" id="studentGroupId" name="studentGroupId">
                        <option value="">Все группы</option>
                        <option th:each="studentGroup : ${studentGroups}"
                                th:value="${studentGroup.idStudentGroup}"
                                th:text="${studentGroup.nameGroup}"
                                th:selected="${selectedGroup == studentGroup.idStudentGroup}">
                        </option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="teachingMethodId" class="form-label">Метод обучения:</label>
                    <select class="form-select" id="teachingMethodId" name="teachingMethodId">
                        <option value="">Все методы</option>
                        <option th:each="teachingMethod : ${teachingMethods}"
                                th:value="${teachingMethod.idTeachingMethod}"
                                th:text="${teachingMethod.nameMethod}"
                                th:selected="${selectedMethod == teachingMethod.idTeachingMethod}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Применить</button>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <a th:href="@{/student}" class="btn btn-outline-secondary">Сбросить фильтры</a>
                </div>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-between mb-3">
        <a href="/student/add" class="btn btn-warning">Добавить студента</a>
        <button type="button" class="btn btn-primary" onclick="window.print()">Печать</button>
    </div>

    <div th:if="${students.empty}" class="alert alert-info">
        Студентов не найдено
    </div>

    <div th:each="student : ${students}" class="alert alert-info mt-2">
        <h3>
            <span th:text="${student.fullName}"></span>
        </h3>
        <p th:text="'Группа: ' + ${student.studentGroup.nameGroup}"></p>
        <p th:text="'Метод обучения: ' + ${student.studentGroup.teachingMethod.nameMethod}"></p>
        <a th:href="'/student/' + ${student.idStudent}" class="btn btn-warning">Детальнее</a>
    </div>
</div>

<!-- Контейнер для печатной формы -->
<div id="print-content">
    <h1>Список Студентов</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">ФИО</th>
            <th scope="col">Группа</th>
            <th scope="col">Метод обучения</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.studentGroup.nameGroup}"></td>
            <td th:text="${student.studentGroup.teachingMethod.nameMethod}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>

<script>
    window.onbeforeprint = function() {
        document.getElementById('print-content').style.display = 'block';
    };
    window.onafterprint = function() {
        document.getElementById('print-content').style.display = 'none';
    };
</script>
</body>
</html>
