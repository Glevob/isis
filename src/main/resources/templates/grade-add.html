<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить оценку</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="container py-4">
    <h1 class="mb-4" th:text="'Добавить оценку для: ' + ${student.fullName}"></h1>

    <form th:action="@{/student/{studentId}/grades/add(studentId=${student.idStudent})}"
          th:object="${grade}" method="post">
        <div class="mb-3">
            <label for="testName" class="form-label">Название теста</label>
            <input type="text" class="form-control" id="testName" th:field="*{testName}" required>
        </div>
        <div class="mb-3">
            <label for="valueScore" class="form-label">Оценка</label>
            <input type="text" class="form-control" id="valueScore" th:field="*{valueScore}" required>
        </div>
        <div class="mb-3">
            <label for="testDate" class="form-label">Дата</label>
            <input type="date" class="form-control" id="testDate" th:field="*{testDate}" required>
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a th:href="@{'/student/' + ${student.idStudent} + '/grades'}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
