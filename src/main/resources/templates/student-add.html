<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавление студента</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div style="padding-top: 60px;" class="container mt-5">
    <h1>Добавление студента</h1>
    <form action="/student/add" method="post" enctype="multipart/form-data">

        <input type="text" name="fullName" placeholder="Введите ФИО студента" class="form-control" required><br>

        <label for="studentGroups">Выберите группу:</label>
        <select name="studentGroupId" id="studentGroups" class="form-control" required>
            <option th:each="studentGroup : ${studentGroups}" th:value="${studentGroup.idStudentGroup}"
                    th:text="${studentGroup.nameGroup}"></option>
        </select><br>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='/studentGroup/add'">Добавить групуп</button><br><br>

        <button type="submit" class="btn btn-success">Добавить студента</button>
    </form>

</div>

<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
