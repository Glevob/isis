<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавление метода обучения</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1 0 auto;
            padding-bottom: 60px; /* Отступ для футера */
        }
        .footer {
            flex-shrink: 0;
            width: 100%;
            height: 60px; /* Высота футера */
            line-height: 60px; /* Центрирование текста по вертикали */
        }
    </style>
</head>
<body>
<div th:insert="~{blocks/header :: header}"></div>

<div class="content">
    <div style="padding-top: 60px;" class="container mt-5">
        <h1>Добавление метода обучения</h1>
        <form action="/teachingMethod/add" method="post">
            <input type="text" name="nameMethod" placeholder="Введите наименование метода обучения" class="form-control"><br>
            <button type="submit" class="btn btn-success">Добавить метод обучения</button>
        </form>
    </div>
</div>
<footer class="footer bg-light text-center">
    <div th:insert="~{blocks/footer :: footer}"></div>
</footer>
</body>
</html>
